<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliraza Khan — DevOps / SRE Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07090f;
    --bg2: #0d1117;
    --bg3: #111827;
    --border: rgba(56,189,248,0.12);
    --accent: #34d399;
    --accent2: oklch(0.72 0.13 210);
    --text: #e8edf5;
    --muted: #7a8899;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
    --nav-bg: rgba(7,9,15,0.85);
    --card-hover-shadow: rgba(52,211,153,0.06);
    --particle-color: 52,211,153;
  }

  html.light {
    --bg: #f0f4f8;
    --bg2: #ffffff;
    --bg3: #e4ecf3;
    --border: rgba(0,0,0,0.09);
    --text: #0d1117;
    --muted: #4a5568;
    --nav-bg: rgba(240,244,248,0.9);
    --card-hover-shadow: rgba(52,211,153,0.08);
    --particle-color: 52,211,153;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
    line-height: 1.6;
    transition: background 0.4s ease, color 0.4s ease;
  }

  /* Canvas particle background */
  #particle-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
  }

  #root { position: relative; z-index: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  /* Nav */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 0 48px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--nav-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    transition: background 0.4s ease;
  }

  /* Theme toggle */
  .theme-toggle {
    position: relative;
    width: 56px;
    height: 28px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .theme-toggle input { display: none; }

  .toggle-track {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    position: relative;
    transition: all 0.35s ease;
    overflow: hidden;
  }

  html.light .toggle-track {
    background: #d4e3f0;
  }

  .toggle-track::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(var(--particle-color),0.15), transparent);
    border-radius: inherit;
  }

  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 1;
  }

  html.light .toggle-thumb {
    transform: translateX(28px);
  }

  .toggle-icon {
    font-size: 11px;
    line-height: 1;
    user-select: none;
  }

  .toggle-labels {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    pointer-events: none;
  }

  .toggle-label-dark {
    position: absolute;
    right: 6px;
    font-size: 9px;
    font-family: var(--mono);
    color: var(--muted);
    opacity: 1;
    transition: opacity 0.3s;
  }

  .toggle-label-light {
    position: absolute;
    left: 6px;
    font-size: 9px;
    font-family: var(--mono);
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.3s;
  }

  html.light .toggle-label-dark { opacity: 0; }
  html.light .toggle-label-light { opacity: 1; }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .nav-logo {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--accent); }

  /* Sections */
  section {
    padding: 100px 48px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-tag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-tag::after {
    content: '';
    display: block;
    height: 1px;
    width: 40px;
    background: var(--accent);
    opacity: 0.4;
  }

  .section-title {
    font-size: clamp(28px, 3.5vw, 42px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 56px;
    color: var(--text);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    font-family: var(--mono);
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    letter-spacing: 0.05em;
  }

  .btn-primary {
    background: var(--accent);
    color: #07090f;
    border: none;
    font-weight: 600;
  }

  .btn-primary:hover {
    background: white;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(56,189,248,0.3);
  }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* Cards */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.4s;
  }

  .card:hover {
    border-color: rgba(var(--particle-color),0.3);
    box-shadow: 0 0 32px var(--card-hover-shadow);
  }

  /* Light mode adjustments */
  html.light .form-input,
  html.light .form-textarea {
    background: #f8fbff;
    color: var(--text);
  }

  html.light .skill-tag {
    background: rgba(var(--particle-color),0.07);
    border-color: rgba(var(--particle-color),0.18);
    color: var(--text);
  }

  html.light .skill-tag:hover {
    background: rgba(var(--particle-color),0.15);
    color: var(--accent);
  }

  html.light footer {
    background: transparent;
  }

  html.light .tweak-select {
    background: #f0f4f8;
    color: var(--text);
  }

  /* ── Core animation keyframes ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-24px); }
  }
  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(32px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeRight {
    from { opacity: 0; transform: translateX(-32px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56,189,248,0.4); }
    50%       { box-shadow: 0 0 0 8px rgba(56,189,248,0); }
  }
  @keyframes heroNameIn {
    from { opacity: 0; transform: translateY(40px) skewY(3deg); }
    to   { opacity: 1; transform: translateY(0) skewY(0deg); }
  }
  @keyframes heroFadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Scroll-driven animation states ── */
  /* Elements with [data-anim] start hidden */
  [data-anim] {
    opacity: 0;
    will-change: transform, opacity;
  }

  /* Entered — animated in */
  [data-anim].anim-in {
    animation-fill-mode: both;
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    animation-duration: 0.65s;
  }
  [data-anim="up"].anim-in        { animation-name: fadeUp; }
  [data-anim="left"].anim-in      { animation-name: fadeLeft; }
  [data-anim="right"].anim-in     { animation-name: fadeRight; }
  [data-anim="scale"].anim-in     { animation-name: scaleIn; }

  /* Exited — animated out (scrolled past) */
  [data-anim].anim-out {
    animation-fill-mode: both;
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    animation-duration: 0.4s;
    animation-name: fadeDown;
    pointer-events: none;
  }

  /* Hero specific — triggered by class added on load */
  .hero-name { opacity: 0; }
  .hero-name.hero-in {
    animation: heroNameIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.1s both;
  }
  .hero-status { opacity: 0; }
  .hero-status.hero-in {
    animation: heroFadeIn 0.7s ease 0s both;
  }
  .hero-tagline { opacity: 0; }
  .hero-tagline.hero-in {
    animation: heroFadeIn 0.7s ease 0.3s both;
  }
  .hero-desc { opacity: 0; }
  .hero-desc.hero-in {
    animation: heroFadeIn 0.7s ease 0.45s both;
  }
  .hero-buttons { opacity: 0; }
  .hero-buttons.hero-in {
    animation: heroFadeIn 0.7s ease 0.6s both;
  }
  .hero-stats { opacity: 0; }
  .hero-stats.hero-in {
    animation: heroFadeIn 0.7s ease 0.75s both;
  }

  .anim-fade-up {
    animation: fadeUp 0.6s ease forwards;
  }

  /* Hero */
  .hero-section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: 64px;
    max-width: 1100px;
    margin: 0 auto;
    padding-left: 48px;
    padding-right: 48px;
  }

  .hero-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  .hero-name {
    font-size: clamp(48px, 7vw, 88px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.0;
    margin-bottom: 16px;
  }

  .hero-name span { color: var(--accent); }

  .hero-tagline {
    font-family: var(--mono);
    font-size: clamp(14px, 1.8vw, 18px);
    color: var(--muted);
    margin-bottom: 40px;
    min-height: 1.5em;
  }

  .cursor {
    display: inline-block;
    color: var(--accent);
    animation: blink 1s infinite;
    margin-left: 2px;
  }

  .hero-desc {
    font-size: 16px;
    color: var(--muted);
    max-width: 540px;
    margin-bottom: 40px;
    line-height: 1.8;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 80px;
  }

  .hero-stats {
    display: flex;
    gap: 48px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }

  .stat-num {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Skills grid */
  .skills-categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
  }

  .skill-category-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .skill-tag {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 4px;
    background: rgba(56,189,248,0.07);
    border: 1px solid rgba(56,189,248,0.15);
    color: var(--text);
    transition: all 0.2s;
    cursor: default;
  }

  .skill-tag:hover {
    background: rgba(56,189,248,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Timeline */
  .timeline {
    position: relative;
    padding-left: 28px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, var(--accent), transparent);
    opacity: 0.3;
  }

  .timeline-item {
    position: relative;
    margin-bottom: 48px;
  }

  .timeline-dot {
    position: absolute;
    left: -34px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
  }

  .exp-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .exp-role {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }

  .exp-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    white-space: nowrap;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .exp-company {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .exp-bullets {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .exp-bullets li {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    padding-left: 16px;
    position: relative;
  }

  .exp-bullets li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  /* Projects */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }

  .project-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .project-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text);
  }

  .project-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .project-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .stack-badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    background: rgba(56,189,248,0.05);
    border: 1px solid rgba(56,189,248,0.12);
    color: var(--muted);
  }

  /* Education */
  .edu-card {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }

  .edu-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: rgba(56,189,248,0.1);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--accent);
    font-size: 22px;
  }

  /* Contact */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
  }

  .contact-info-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .contact-info-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: rgba(56,189,248,0.08);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 16px;
    flex-shrink: 0;
  }

  .contact-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  .contact-value {
    font-size: 14px;
    color: var(--text);
    word-break: break-all;
  }

  .contact-value a {
    color: var(--text);
    text-decoration: none;
    transition: color 0.2s;
  }

  .contact-value a:hover { color: var(--accent); }

  /* Form */
  .form-group { margin-bottom: 20px; }

  .form-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }

  .form-input, .form-textarea {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus, .form-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.08);
  }

  .form-textarea { resize: vertical; min-height: 120px; }

  /* Footer */
  footer {
    text-align: center;
    padding: 32px 48px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 280px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    z-index: 999;
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    font-family: var(--sans);
  }

  .tweaks-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tweaks-close {
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
  }

  .tweak-row {
    margin-bottom: 14px;
  }

  .tweak-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }

  .tweak-label span {
    font-family: var(--mono);
    color: var(--accent);
  }

  .tweak-select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--mono);
    outline: none;
    cursor: pointer;
  }

  /* ── Responsive ── */

  /* Tablet: 768px – 1024px */
  @media (max-width: 1024px) {
    section, .hero-section {
      padding-left: 32px;
      padding-right: 32px;
    }
    nav { padding: 0 32px; }
    .skills-categories {
      grid-template-columns: repeat(2, 1fr);
    }
    .projects-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .hero-stats { gap: 32px; flex-wrap: wrap; }
  }

<script>
// ── Floating DevOps keywords — random wandering ──
(function() {
  const WORDS = [
    'kubectl','terraform','docker','helm','prometheus',
    'kubernetes','grafana','ansible','ci/cd','eks',
    'gitops','nginx','bash','golang','datadog',
    'alertmanager','iac','sre','devops','vault',
    'argocd','pipeline','linux','aws','azure',
    'trivy','scalr','thanos','promtail','k8s',
    'cloudformation','fargate','github-actions',
    'openstack','aurora-rds','xmatters','harness',
  ];

  const container = document.getElementById('floating-keywords');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;';

  let wordIdx = 0;
  const MAX_ACTIVE = 16;
  let activeCount = 0;

  function getRGB() {
    return getComputedStyle(document.documentElement).getPropertyValue('--particle-color').trim() || '52,211,153';
  }

  function spawnWord() {
    if (activeCount >= MAX_ACTIVE) return;
    activeCount++;

    const word = WORDS[wordIdx % WORDS.length];
    wordIdx++;

    const el = document.createElement('span');
    el.textContent = word;

    const size = 10 + Math.floor(Math.random() * 7);
    const opacity = 0.06 + Math.random() * 0.09;
    const rgb = getRGB();

    // Random start position anywhere on screen
    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;

    // Random velocity — any direction, any angle
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.25 + Math.random() * 0.55;
    let vx = Math.cos(angle) * speed;
    let vy = Math.sin(angle) * speed;

    const lifetime = (12000 + Math.random() * 16000);
    const born = performance.now();

    el.style.cssText = `
      position:absolute;left:0;top:0;
      font-family:'JetBrains Mono',monospace;
      font-size:${size}px;
      color:rgb(${rgb});
      opacity:0;
      white-space:nowrap;user-select:none;
      letter-spacing:0.06em;
      will-change:transform,opacity;
      transform:translate(${x}px,${y}px);
    `;

    container.appendChild(el);

    // Fade in next frame
    setTimeout(() => { el.style.transition = 'opacity 1.2s ease'; el.style.opacity = opacity; }, 50);

    function tick(now) {
      const age = now - born;

      // Slight random direction drift — changes course gently over time
      const wobble = 0.003;
      vx += (Math.random() - 0.5) * wobble;
      vy += (Math.random() - 0.5) * wobble;

      // Clamp speed so it doesn't accelerate too much
      const spd = Math.sqrt(vx*vx + vy*vy);
      if (spd > 0.8) { vx = (vx/spd)*0.8; vy = (vy/spd)*0.8; }
      if (spd < 0.2) { vx = (vx/spd)*0.2; vy = (vy/spd)*0.2; }

      x += vx;
      y += vy;

      // Wrap around edges (toroidal)
      const W = window.innerWidth, H = window.innerHeight;
      if (x > W + 100) x = -100;
      if (x < -100)    x = W + 100;
      if (y > H + 40)  y = -40;
      if (y < -40)     y = H + 40;

      el.style.transform = `translate(${x}px,${y}px)`;

      if (age < lifetime) {
        // Fade out last 2s
        if (age > lifetime - 2000) {
          const t = (lifetime - age) / 2000;
          el.style.opacity = opacity * t;
        }
        requestAnimationFrame(tick);
      } else {
        el.remove();
        activeCount--;
      }
    }

    requestAnimationFrame(tick);
  }

  // Initial burst then continuous
  for (let i = 0; i < 10; i++) setTimeout(spawnWord, i * 300);
  setInterval(spawnWord, 1600);
})();
</script>


<script>
// ── Scroll animation observer ──
// Runs after React mounts (waits for DOM to populate)
window.initScrollAnimations = function initScrollAnimations() {
  const ELS = document.querySelectorAll('[data-anim]');
  if (!ELS.length) { setTimeout(initScrollAnimations, 100); return; }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const el = entry.target;
      const delay = el.dataset.delay || 0;
      if (entry.isIntersecting) {
        el.classList.remove('anim-out');
        setTimeout(() => el.classList.add('anim-in'), Number(delay));
      } else {
        // Only exit-animate if element was already visible (has anim-in)
        if (el.classList.contains('anim-in')) {
          el.classList.remove('anim-in');
          el.classList.add('anim-out');
        }
      }
    });
  }, {
    threshold: 0.12,
    rootMargin: '0px 0px -60px 0px'
  });

  ELS.forEach(el => observer.observe(el));
}

// Hero entrance on load
window.addEventListener('load', () => {
  setTimeout(() => {
    document.querySelectorAll('.hero-status,.hero-name,.hero-tagline,.hero-desc,.hero-buttons,.hero-stats')
      .forEach(el => el.classList.add('hero-in'));
  }, 80);
  setTimeout(window.initScrollAnimations, 400);
});
</script>

<script>
// Particle Network Background
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], animId;
  const COUNT = 55, MAX_DIST = 140;

  function getAccentRGB() {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--particle-color').trim();
    return v || '52,211,153';
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function Particle() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.r = Math.random() * 2 + 1;
  }

  function init() {
    particles = Array.from({ length: COUNT }, () => new Particle());
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const rgb = getAccentRGB();
    const isLight = document.documentElement.classList.contains('light');
    const nodeAlpha = isLight ? 0.35 : 0.55;
    const lineAlpha = isLight ? 0.12 : 0.18;

    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rgb},${nodeAlpha})`;
      ctx.fill();
    });

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST) {
          const alpha = lineAlpha * (1 - dist / MAX_DIST);
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(${rgb},${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); });
  resize();
  init();
  draw();
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

// Typewriter hook
function useTypewriter(texts, speed = 60, pause = 1800) {
  const [display, setDisplay] = useState('');
  const [idx, setIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    const current = texts[idx];
    let timer;
    if (!deleting && charIdx < current.length) {
      timer = setTimeout(() => setCharIdx(c => c + 1), speed);
    } else if (!deleting && charIdx === current.length) {
      timer = setTimeout(() => setDeleting(true), pause);
    } else if (deleting && charIdx > 0) {
      timer = setTimeout(() => setCharIdx(c => c - 1), speed / 2);
    } else if (deleting && charIdx === 0) {
      setDeleting(false);
      setIdx(i => (i + 1) % texts.length);
    }
    setDisplay(current.slice(0, charIdx));
    return () => clearTimeout(timer);
  }, [charIdx, deleting, idx, texts, speed, pause]);

  return display;
}

// Counter hook
function useCounter(target, duration = 1500, start = false) {
  const [count, setCount] = useState(0);
  useEffect(() => {
    if (!start) return;
    let startTime;
    const step = (ts) => {
      if (!startTime) startTime = ts;
      const pct = Math.min((ts - startTime) / duration, 1);
      setCount(Math.floor(pct * target));
      if (pct < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [target, duration, start]);
  return count;
}

// Intersection observer hook
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

// Tweaks Panel
function TweaksPanel({ visible, onClose }) {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  const applyAccent = (val) => {
    const color = ACCENT_MAP[val] || ACCENT_MAP.sky;
    document.documentElement.style.setProperty('--accent', color);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: val } }, '*');
  };

  const applyFont = (val) => {
    const fontMap = { modern: "'Space Grotesk', sans-serif", mono: "'JetBrains Mono', monospace" };
    document.documentElement.style.setProperty('--sans', fontMap[val] || fontMap.modern);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { fontStyle: val } }, '*');
  };

  const applyDensity = (val) => {
    document.querySelectorAll('section').forEach(s => {
      s.style.paddingTop = val === 'compact' ? '64px' : '100px';
      s.style.paddingBottom = val === 'compact' ? '64px' : '100px';
    });
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { density: val } }, '*');
  };

  if (!visible) return null;

  return (
    <div className="tweaks-panel">
      <div className="tweaks-title">
        Tweaks
        <span className="tweaks-close" onClick={onClose}>×</span>
      </div>
      <div className="tweak-row">
        <div className="tweak-label">Accent color <span>{tweaks.accentColor}</span></div>
        <select className="tweak-select" value={tweaks.accentColor} onChange={e => {
          setTweaks({ ...tweaks, accentColor: e.target.value });
          applyAccent(e.target.value);
        }}>
          <option value="sky">Sky Blue</option>
          <option value="emerald">Emerald</option>
          <option value="violet">Violet</option>
          <option value="orange">Orange</option>
        </select>
      </div>
      <div className="tweak-row">
        <div className="tweak-label">Font style <span>{tweaks.fontStyle}</span></div>
        <select className="tweak-select" value={tweaks.fontStyle} onChange={e => {
          setTweaks({ ...tweaks, fontStyle: e.target.value });
          applyFont(e.target.value);
        }}>
          <option value="modern">Space Grotesk</option>
          <option value="mono">JetBrains Mono</option>
        </select>
      </div>
      <div className="tweak-row">
        <div className="tweak-label">Section density <span>{tweaks.density}</span></div>
        <select className="tweak-select" value={tweaks.density} onChange={e => {
          setTweaks({ ...tweaks, density: e.target.value });
          applyDensity(e.target.value);
        }}>
          <option value="comfortable">Comfortable</option>
          <option value="compact">Compact</option>
        </select>
      </div>
    </div>
  );
}

function App() {
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [dark, setDark] = useState(() => {
    const saved = localStorage.getItem('ak-theme');
    return saved ? saved === 'dark' : true;
  });

  useEffect(() => {
    if (dark) {
      document.documentElement.classList.remove('light');
    } else {
      document.documentElement.classList.add('light');
    }
    localStorage.setItem('ak-theme', dark ? 'dark' : 'light');
  }, [dark]);

  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    // Re-init scroll animations after React paints
    if (typeof initScrollAnimations === 'function') {
      setTimeout(initScrollAnimations, 300);
    }
  }, []);

  return (
    <>
      <Nav dark={dark} onToggle={() => setDark(d => !d)} />
      <Hero />
      <Skills />
      <Experience />
      <Projects />
      <Education />
      <Contact />
      <footer>
        <span style={{ color: 'var(--accent)', fontFamily: 'var(--mono)' }}>ak:~$ </span>
        Aliraza Khan · DevOps / SRE Engineer · Mumbai, India · 2025
      </footer>
      <TweaksPanel visible={tweaksOpen} onClose={() => setTweaksOpen(false)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
